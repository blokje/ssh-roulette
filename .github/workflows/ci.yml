name: CI/CD

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Install dependencies
      run: |
        uv sync --all-extras
    
    - name: Run black (code formatting check)
      run: |
        uv run black --check ssh_roulette tests
    
    - name: Run flake8 (linting)
      run: |
        uv run flake8 ssh_roulette tests --max-line-length=100 --extend-ignore=E203,W503
    
    - name: Run mypy (type checking)
      run: |
        uv run mypy ssh_roulette --ignore-missing-imports
      continue-on-error: true
    
    - name: Run tests with coverage
      run: |
        uv run pytest tests/ -v --cov=ssh_roulette --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
      continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Install dependencies
      run: |
        uv sync
    
    - name: Run safety check
      run: |
        uv pip install safety
        uv run safety check || true
      continue-on-error: true
