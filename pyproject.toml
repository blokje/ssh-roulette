[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssh-roulette"
version = "0.1.0"
description = "SSH-based Roulette game service"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "asyncssh>=2.14.0",
    "aiosqlite>=0.19.0",
    "blessed>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
ssh-roulette = "ssh_roulette.server:main"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
